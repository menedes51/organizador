<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Organizador">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>Organizador</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var p = localStorage.getItem('organizador.theme') || 'auto';
      var t = p === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;
      if (localStorage.getItem('organizador.density')) document.documentElement.classList.add('compact');
      document.documentElement.dataset.theme = t;
      var ac = localStorage.getItem('organizador.accent');
      if (ac) document.documentElement.style.setProperty('--accent', ac);
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-wrap">
      <main>
        <div id="top"></div>
        <div id="composer" class="composer"></div>
        <div id="content"></div>
      </main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
  <button class="fab" id="fab" aria-label="Nova tarefa"></button>
  <div class="backdrop" id="backdrop"></div>
  <section class="detail" id="detail" aria-label="Detalhes da tarefa"></section>
  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
